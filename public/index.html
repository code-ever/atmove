<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B5D3B">
<title>ATM Enugu Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concept: a ward-to-state "ledger" — deep green institutional surfaces, gold used only for action and rank, hard-edged bold type. */
:root{
 --brand:#0B5D3B; --gold:#C9A227; --ink:#1D2523; --surface:#F0F3F1; --bg:#FFFFFF; --card:#FFFFFF; --line:#D9E1DD; --muted:#546260;
 --brand-700:color-mix(in srgb,var(--brand) 80%,#000); --brand-900:color-mix(in srgb,var(--brand) 42%,#000);
 --brand-50:color-mix(in srgb,var(--brand) 8%,var(--bg)); --brand-100:color-mix(in srgb,var(--brand) 16%,var(--bg));
 --gold-600:color-mix(in srgb,var(--gold) 78%,#000); --gold-50:color-mix(in srgb,var(--gold) 15%,var(--bg));
 --brand-text:var(--brand); --on-gold:#1C1700;
 --ok:#16794C; --ok-bg:#E3F4EA; --warn:#9A5B00; --warn-bg:#FFF1D6; --bad:#B42318; --bad-bg:#FDE8E6; --info:#1D5FA8; --info-bg:#E4EFFB;
 --r:14px; --r-sm:9px; --sh:0 1px 2px rgba(10,30,20,.06),0 6px 18px rgba(10,30,20,.07);
 --f-head:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ink:#E7EEEA; --surface:#18221E; --bg:#0E1412; --card:#141D19; --line:#26342F; --muted:#9DABA5; --brand-text:color-mix(in srgb,var(--brand) 45%,#fff);
 --ok:#52D192; --ok-bg:#12311F; --warn:#F0B34F; --warn-bg:#3A2A0B; --bad:#FF8A7E; --bad-bg:#3C1713; --info:#7DB6F0; --info-bg:#132A44; --sh:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --ink:#E7EEEA; --surface:#18221E; --bg:#0E1412; --card:#141D19; --line:#26342F; --muted:#9DABA5; --brand-text:color-mix(in srgb,var(--brand) 45%,#fff);
 --ok:#52D192; --ok-bg:#12311F; --warn:#F0B34F; --warn-bg:#3A2A0B; --bad:#FF8A7E; --bad-bg:#3C1713; --info:#7DB6F0; --info-bg:#132A44; --sh:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.1;margin:0 0 .5em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:900}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800}
h3{font-size:1.2rem;font-weight:800}
h4{font-size:1rem;font-weight:700}
p{margin:0 0 1em}
a{color:var(--brand-text)}
img,svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:700 .74rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-600)}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:var(--gold);color:var(--on-gold);padding:10px 14px;z-index:200;border-radius:8px}.skip:focus{top:8px}
/* demo bar */
.demobar{background:var(--gold);color:var(--on-gold);font-size:.78rem;font-weight:600;text-align:center;padding:6px 12px}
.demobar b{letter-spacing:.06em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid transparent;font:700 .95rem var(--f-body);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s;background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-700)}
.btn-gold{background:var(--gold);color:var(--on-gold)}.btn-gold:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 45%,transparent)}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink)}.btn-outline:hover{border-color:var(--brand-text)}
.btn-ghost{background:transparent;color:var(--brand-text)}
.btn-light{background:#fff;color:#0B3B27}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{min-height:36px;padding:0 14px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-head);font-weight:900}
.logo svg{width:42px;height:42px}
.logo>span{white-space:nowrap}.logo small{display:block;font:600 .62rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:none;align-items:center;gap:2px;margin-left:auto}
.nav a{padding:9px 10px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;white-space:nowrap}
.nav a:hover,.nav a.on{background:var(--brand-50);color:var(--brand-text)}
.hdr-r{display:flex;gap:8px;align-items:center;margin-left:auto}
.nav+.hdr-r{margin-left:6px}
.burger{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.mnav{position:fixed;inset:0;z-index:90;background:var(--bg);padding:max(16px,env(safe-area-inset-top,0px)) 18px 24px;overflow:auto}
.mnav a.l{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font:700 1.1rem var(--f-head)}
@media(min-width:1180px){.nav{display:flex}.burger{display:none}}
@media(max-width:1179px){.hdr .btn-login{display:none}}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;min-height:44px;position:relative}
.searchbar input{border:0;background:transparent;color:var(--ink);font:inherit;outline:none;width:100%;min-width:0}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);z-index:70;overflow:hidden}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 14px;cursor:pointer;font:inherit}
.sugg button:hover{background:var(--brand-50)}
/* hero */
.hero{background:radial-gradient(1000px 500px at 85% -10%,color-mix(in srgb,var(--gold) 28%,transparent),transparent 60%),linear-gradient(160deg,var(--brand-900),var(--brand) 70%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -5% -1px -5%;height:70px;background:var(--bg);clip-path:polygon(0 100%,100% 100%,100% 0,60% 70%,30% 20%,0 80%)}
.hero .wrap{display:grid;gap:36px;padding-block:44px 90px;align-items:center}
@media(min-width:980px){.hero .wrap{grid-template-columns:1.15fr .85fr;padding-block:64px 110px}}
.hero h1{margin-bottom:.35em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.15rem;max-width:52ch;color:#E3F0E9}
.tag{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem;letter-spacing:.04em;margin-bottom:18px;background:rgba(255,255,255,.08)}
.portraits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.portraits .ph:first-child{grid-column:span 2;aspect-ratio:16/9}
.ph{position:relative;border-radius:var(--r);overflow:hidden;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)) 0 14px,color-mix(in srgb,var(--brand) 8%,var(--surface)) 14px 28px);display:grid;place-items:center;aspect-ratio:4/3;color:var(--muted);text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.04em}
.ph svg{width:34px;height:34px;opacity:.55;display:block;margin:0 auto 6px}
.hero .ph{background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 14px,rgba(255,255,255,.06) 14px 28px);color:#D8EBE1;border:1px solid rgba(255,255,255,.18)}
.ph .tagl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 7px;font-size:.66rem}
.ph.p1{background:linear-gradient(135deg,#0d6b43,#1f8a5b)}.ph.p2{background:linear-gradient(135deg,#8a6d12,#c9a227)}.ph.p3{background:linear-gradient(135deg,#233a33,#3d5b51)}.ph.p4{background:linear-gradient(135deg,#145c7a,#2a8ab0)}
.ph.p1,.ph.p2,.ph.p3,.ph.p4{color:#fff}
/* sections */
section.sec{padding-block:64px}
section.alt{background:var(--surface)}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:28px}
.sec-h h2{margin:6px 0 0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card.lift{transition:transform .18s,box-shadow .18s,border-color .18s;text-decoration:none;color:inherit;display:block}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--brand-text)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .n{font:900 clamp(1.8rem,4vw,2.5rem)/1 var(--f-head);font-variant-numeric:tabular-nums;color:var(--brand-text)}
.stat .l{font-weight:600;font-size:.86rem;color:var(--muted)}
.stat .ico{width:38px;height:38px;border-radius:10px;background:var(--brand-50);color:var(--brand-text);display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--surface);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.gold{background:var(--gold-50);color:var(--gold-600)}
.demo-tag{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-50);color:var(--gold-600);border:1px dashed var(--gold);padding:2px 8px;border-radius:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem var(--f-body);cursor:pointer;min-height:40px}
.chip.on,.chip:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.split{display:grid;gap:24px}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr}.split.w3{grid-template-columns:1.4fr 1fr}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.callout{border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--info) 35%,transparent)}
.callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.callout.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.callout .ic{margin-top:3px}
/* directory */
.dircols{display:grid;gap:14px}
@media(min-width:900px){.dircols{grid-template-columns:1fr 1fr 1.2fr}}
.dcol{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.dcol h4{padding:12px 16px;margin:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlist{max-height:360px;overflow:auto;list-style:none;margin:0;padding:6px}
.dlist button{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;font:inherit;min-height:44px}
.dlist button:hover{background:var(--brand-50)}.dlist button.on{background:var(--brand);color:#fff}
.dlist button.on .muted{color:#d6efe3}
.tile-map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px}
.tile-map button{aspect-ratio:1.15;border:0;border-radius:10px;background:var(--brand-100);color:var(--ink);font:700 .68rem/1.15 var(--f-body);cursor:pointer;padding:4px;display:grid;place-items:center;text-align:center;transition:transform .15s,background .15s}
.tile-map button:hover{background:var(--brand);color:#fff;transform:scale(1.06)}
.tile-map button.on{background:var(--gold);color:var(--on-gold)}
.tile-map i{visibility:hidden}
@media(max-width:520px){.tile-map button{font-size:.56rem}}
.tree,.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}
.tree{border:0;padding:0}
.tree summary{cursor:pointer;padding:8px 4px;font-weight:600;min-height:40px}
.tree a{text-decoration:none}
/* tables */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;padding:10px 12px;background:var(--surface);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th button{all:unset;cursor:pointer}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--brand-50)}
@media(max-width:720px){
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px;background:var(--card)}
 .tbl td{border:0;display:flex;justify-content:space-between;gap:12px;padding:7px 12px;text-align:right}
 .tbl td::before{content:attr(data-l);font-weight:700;color:var(--muted);text-align:left;font-size:.78rem}
}
.dt-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dt-bar .field{margin:0;min-width:140px;flex:1}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.86rem}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:sk 1.1s infinite linear;margin:14px 0}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .ic{width:42px;height:42px;opacity:.5;margin-bottom:8px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.field>label,.lbl{font-weight:700;font-size:.88rem}
.field .req{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--gold) 55%,transparent);border-color:var(--brand-text)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.field .err{color:var(--bad);font-size:.82rem;font-weight:600;display:flex;gap:6px;align-items:center}
.field .hint{font-size:.8rem;color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);margin-bottom:10px}
.opt input{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--brand);flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-50)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 10px;font-weight:700}
.meter{height:6px;border-radius:6px;background:var(--surface);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .25s,background .25s}
.combo{position:relative}
.combo ul{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.combo li{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:44px;align-items:center}
.combo li:hover,.combo li.hl{background:var(--brand-50)}
.combo li.none{color:var(--muted);cursor:default}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps div{flex:1;min-width:0;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.steps div::before{content:"";display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px}
.steps div.done::before,.steps div.cur::before{background:var(--brand)}.steps div.cur{color:var(--brand-text)}
.steps div span{display:none}@media(min-width:620px){.steps div span{display:inline}}
.authbox{max-width:520px;margin:0 auto;padding:30px 0 70px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spn .7s linear infinite;display:inline-block}
@keyframes spn{to{transform:rotate(360deg)}}
/* page head */
.phead{background:linear-gradient(160deg,var(--brand-900),var(--brand));color:#fff;padding-block:42px 36px}
.phead h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0 6px}
.phead p{color:#D8EBE1;max-width:62ch;margin:0}
.phead .eyebrow{color:var(--gold)}
.crumbs{font-size:.82rem;color:#CFE5DA;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}.crumbs a{color:#fff}
.page{padding-block:34px 70px}
/* article, events */
.art-card{display:flex;flex-direction:column}
.art-card .ph{aspect-ratio:16/9;border-radius:0}
.art-card .b{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.art-body{max-width:70ch;font-size:1.06rem;line-height:1.75}
.datebox{width:64px;flex:none;text-align:center;border-radius:12px;background:var(--brand);color:#fff;padding:8px 4px;font-family:var(--f-head);line-height:1}
.datebox b{display:block;font-size:1.6rem;font-weight:900}.datebox span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.evrow{display:flex;gap:16px;align-items:flex-start}
.gal{columns:3 220px;column-gap:14px}
.gal .gi{break-inside:avoid;margin-bottom:14px;cursor:pointer;position:relative}
.gal .ph{aspect-ratio:auto;min-height:150px}
.play{position:absolute;inset:0;display:grid;place-items:center}.play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.person{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-100);color:var(--brand-text);display:grid;place-items:center;font:800 1.1rem var(--f-head);flex:none}
.avatar.lg{width:120px;height:120px;font-size:2.4rem}
.footer{background:var(--brand-900);color:#CFE2D8;padding-block:50px 28px;margin-top:0}

 pw:k=>{const v=M_[k]||'';if(v.length<8)E[k]='Use at least 8 characters.';else if(!/[A-Za-z]/.test(v)||!/\d/.test(v))E[k]='Include at least one letter and one number.';else if(/^0\d{10}$/.test(v)||/ATM-ENU/i.test(v))E[k]='Do not use a phone number or member ID as a password.'}};
const pwScore=v=>{let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;return s};
/* searchable select */
const COMBO={};
function combo(id,label,opts,val,o={}){COMBO[id]={opts,onpick:o.onpick,val};const cur=opts().find(x=>x.v===val);const err=E[o.ek||id];
 return `<div class="field ${err?'bad':''}"><label for="cb_${id}">${label}${o.req?' <span class="req" aria-hidden="true">*</span>':''}</label><div class="combo" data-combo="${id}"><input id="cb_${id}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cl_${id}" autocomplete="off" placeholder="${o.disabled?esc(o.dph||'Select above first'):'Type to search or choose…'}" value="${esc(cur?cur.label:'')}" ${o.disabled?'disabled':''}><ul id="cl_${id}" role="listbox" hidden></ul></div>${o.hint?`<div class="hint">${o.hint}</div>`:''}${err?`<div class="err" role="alert">${ic('alert')}${esc(err)}</div>`:''}</div>`}
function comboList(id,q){const C=COMBO[id],box=$(`[data-combo="${id}"]`);if(!box)return;const ul=$('ul',box);q=(q||'').toLowerCase();const items=C.opts().filter(x=>!q||(x.label+' '+(x.sub||'')).toLowerCase().includes(q));
 ul.innerHTML=items.length?items.map((x,i)=>`<li role="option" data-v="${esc(x.v)}" class="${i===0?'hl':''}">${esc(x.label)}<span class="muted tiny">${esc(x.sub||'')}</span></li>`).join(''):`<li class="none" role="option" aria-disabled="true">No match found. Check the spelling or code.</li>`;ul.hidden=false;$('input',box).setAttribute('aria-expanded','true')}
function comboPick(id,v){const C=COMBO[id];C.val=v;const box=$(`[data-combo="${id}"]`);const x=C.opts().find(o=>o.v===v);$('input',box).value=x?x.label:'';$('ul',box).hidden=true;$('input',box).setAttribute('aria-expanded','false');C.onpick&&C.onpick(v)}
/* data table */
const DTS={};
function dt(id,o){const St=DTS[id]={q:'',sort:null,dir:1,page:1,f:{},loaded:false,o};setTimeout(()=>{St.loaded=true;dtBody(id)},o.instant?0:420);
 const bar=`<div class="dt-bar">${o.search!==false?`<div class="field"><label class="sr" for="q_${id}">Search</label><input id="q_${id}" data-dtq="${id}" type="search" placeholder="${esc(o.ph||'Search…')}"></div>`:''}${(o.filters||[]).map(f=>`<div class="field"><label class="sr" for="f_${id}_${f.k}">${esc(f.l)}</label><select id="f_${id}_${f.k}" data-dtf="${id}|${f.k}"><option value="">${esc(f.l)}: all</option>${f.opts().map(x=>{x=Array.isArray(x)?x:[x,x];return `<option value="${esc(x[0])}">${esc(x[1])}</option>`}).join('')}</select></div>`).join('')}</div>`;
 return `<div class="dt" data-dt="${id}">${bar}<div class="dtb" id="dtb-${id}"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div></div>`}
const dtVal=(c,r)=>c.v?c.v(r):r[c.k];
function dtRows(id){const St=DTS[id],o=St.o;let rows=o.rows().slice();(o.filters||[]).forEach(f=>{const v=St.f[f.k];if(v)rows=rows.filter(r=>f.fn(r,v))});
 if(St.q){const q=St.q.toLowerCase();rows=rows.filter(r=>(o.cols.map(c=>String(dtVal(c,r)??'')).join(' ')+' '+(o.sk?o.sk(r):'')).toLowerCase().includes(q))}
 if(St.sort){const c=o.cols.find(x=>x.k===St.sort);rows.sort((a,b)=>{const x=dtVal(c,a),y=dtVal(c,b);return (x>y?1:x<y?-1:0)*St.dir})}return rows}
function dtBody(id){const el=$('#dtb-'+id);if(!el)return;const St=DTS[id],o=St.o;if(!St.loaded)return;const all=dtRows(id),size=o.size||8,pages=Math.max(1,Math.ceil(all.length/size));St.page=Math.min(St.page,pages);const rows=all.slice((St.page-1)*size,St.page*size);
 if(!all.length){el.innerHTML=empty(o.empty||'No records found','Try clearing the search or filters.');return}
 el.innerHTML=`<div class="tblwrap"><table class="tbl"><thead><tr>${o.cols.map(c=>`<th scope="col" ${St.sort===c.k?`aria-sort="${St.dir>0?'ascending':'descending'}"`:''}>${c.s===false?esc(c.l):`<button data-dts="${id}|${c.k}">${esc(c.l)}${St.sort===c.k?(St.dir>0?' ▲':' ▼'):''}</button>`}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${o.cols.map(c=>`<td data-l="${esc(c.l)}">${c.r?c.r(r):esc(r[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="pager"><span class="muted">${num(all.length)} record${all.length===1?'':'s'} · page ${St.page} of ${pages}</span><span class="row"><button class="btn btn-outline btn-sm" data-dtp="${id}|-1" ${St.page<=1?'disabled':''}>Previous</button><button class="btn btn-outline btn-sm" data-dtp="${id}|1" ${St.page>=pages?'disabled':''}>Next</button></span></div>`}
const csvEsc=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=(head,rows)=>[head,...rows].map(r=>r.map(csvEsc).join(',')).join('\n');
/* charts */
function hbars(items,o={}){const mx=Math.max(1,...items.map(i=>i.v));return `<div class="hb">${items.map(i=>`<div class="hbr"><span class="hl">${esc(i.l)}</span><span class="hbt"><i style="width:${Math.max(2,i.v/mx*100)}%;background:${i.c||'var(--brand)'}"></i></span><b>${num(i.v)}</b></div>`).join('')}</div>`}
function lineChart(pts,o={}){const W=640,H=220,pl=34,pb=26,pt=12,pr=12;const mx=Math.max(4,...pts.map(p=>p.v));const nice=Math.ceil(mx/4)*4;const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-v/nice);
 const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');const grid=[0,1,2,3,4].map(i=>{const v=nice*i/4;return `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}).join('');
 const lab=pts.map((p,i)=>i%Math.ceil(pts.length/6)===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(p.l)}</text>`:'').join('');const last=pts[pts.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Trend chart')}">${grid}<path d="${d} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(--brand)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="5" fill="var(--gold)" stroke="var(--card)" stroke-width="2"/>${lab}</svg>`}
function donut(items,o={}){const tot=items.reduce((s,i)=>s+i.v,0)||1;let off=0;const r=52,C=2*Math.PI*r;const segs=items.map(i=>{const len=i.v/tot*C;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
 return `<div class="row" style="gap:20px"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(o.label||'Distribution')}">${segs}<text x="70" y="68" text-anchor="middle" style="font:800 20px var(--f-head);fill:var(--ink)">${num(tot)}</text><text x="70" y="84" text-anchor="middle" style="font-size:9px">total</text></svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.l)} · <b>${num(i.v)}</b></span>`).join('')}</div></div>`}
function trend(days=12){const pts=[];for(let i=days-1;i>=0;i--){const d0=iso(dOff(-i*7));const d1=iso(dOff(-(i-1)*7));pts.push({l:fmtD(dOff(-i*7)).slice(0,6),v:M.filter(m=>m.date>=d0&&m.date<d1).length})}return pts}

function reportData(){const t=RP.type;const mm=M.filter(m=>m.status!=='Rejected'&&(RP.period==='all'||m.date>=iso(dOff(-RP.period))));const inl=l=>!RP.lga||l===RP.lga;
 if(t==='lga'){const rows=LGAS.filter(l=>inl(l.id)).map(l=>[l.name,G.wardsOf(l.id).length,G.pusOfLga(l.id).length,mm.filter(m=>m.lga===l.id).length,mm.filter(m=>m.lga===l.id&&m.status==='Approved').length,mm.filter(m=>m.lga===l.id&&m.status==='Pending').length]);return {head:['LGA','Wards','Polling units','Members','Approved','Pending'],rows,chart:rows.map(r=>({l:r[0],v:r[3]}))}}
 if(t==='ward'){const rows=WARDS.filter(w=>inl(w.lga)).map(w=>[G.lga(w.lga).name,w.name,w.code,G.pusOf(w.id).length,mm.filter(m=>m.ward===w.id).length]);return {head:['LGA','Ward','Code','Polling units','Members'],rows,chart:rows.slice().sort((a,b)=>b[4]-a[4]).slice(0,12).map(r=>({l:r[1].slice(0,6)+' '+r[0].slice(0,6),v:r[4]}))}}
 if(t==='pu'){const rows=PUS.filter(p=>inl(p.lga)).map(p=>[G.lga(p.lga).name,G.ward(p.ward).name,p.name,p.code,mm.filter(m=>m.pu===p.id).length]);return {head:['LGA','Ward','Polling unit','Code','Members'],rows,chart:rows.slice().sort((a,b)=>b[4]-a[4]).slice(0,12).map(r=>({l:r[3].replace('DEMO-',''),v:r[4]}))}}
 if(t==='trend'){const pts=trend(12);return {head:['Week starting','New members'],rows:pts.map(p=>[p.l,p.v]),line:pts}}
 if(t==='appts'){const rows=['lga','ward','pu'].map(l=>[ROLES[l],AP.filter(a=>a.level===l&&a.status==='Approved'&&inl(apGeo(a).lga)).length,AP.filter(a=>a.level===l&&a.status==='Pending'&&inl(apGeo(a).lga)).length,AP.filter(a=>a.level===l&&a.status==='Rejected'&&inl(apGeo(a).lga)).length]);return {head:['Level','Approved','Pending','Rejected'],rows,chart:rows.map(r=>({l:r[0].replace(' Coordinator',''),v:r[1]}))}}
 if(t==='coverage'){const rows=LGAS.filter(l=>inl(l.id)).map(l=>{const ws=G.wardsOf(l.id),ps=G.pusOfLga(l.id);const wc=ws.filter(w=>apFor('ward',w.id)).length,pc=ps.filter(p=>apFor('pu',p.id)).length;return [l.name,apFor('lga',l.id)?'Yes':'No',Math.round(wc/ws.length*100)+'%',Math.round(pc/ps.length*100)+'%']});return {head:['LGA','LGA coordinator','Wards covered','Polling units covered'],rows,chart:rows.map(r=>({l:r[0],v:parseInt(r[3])}))}}

function validateCSV(txt){const L=txt.trim().split(/\r?\n/);const errs=[];const head=(L[0]||'').split(',').map(s=>s.trim().toLowerCase());const need=['lga','ward','ward_code','pu','pu_code'];if(need.join()!==head.join())return {errs:['Header must be exactly: '+need.join(',')],ok:0,total:0};
 const wc={},pc={};let ok=0;L.slice(1).forEach((ln,i)=>{const c=ln.split(',').map(s=>s.trim());const n=i+2;let bad=false;if(c.length!==5||c.some(x=>!x)){errs.push(`Line ${n}: all five columns are required.`);return}if(!LGAS.find(l=>l.name.toLowerCase()===c[0].toLowerCase())){errs.push(`Line ${n}: LGA “${c[0]}” does not exist in Enugu State.`);bad=true}
  if(wc[c[2]]&&wc[c[2]]!==c[0]+'|'+c[1]){errs.push(`Line ${n}: ward code ${c[2]} already belongs to ${wc[c[2]].replace('|',' / ')}.`);bad=true}wc[c[2]]=c[0]+'|'+c[1];if(pc[c[4]]){errs.push(`Line ${n}: duplicate polling-unit code ${c[4]} (first seen on line ${pc[c[4]]}).`);bad=true}pc[c[4]]=pc[c[4]]||n;if(!c[4].startsWith(c[2])){errs.push(`Line ${n}: polling-unit code ${c[4]} does not start with its ward code ${c[2]}.`);bad=true}if(!bad)ok++});return {errs,ok,total:L.length-1}}

function contrast(h1,h2){const L=h=>{h=h.replace('#','');const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};const a=L(h1),b=L(h2);return ((Math.max(a,b)+.05)/(Math.min(a,b)+.05)).toFixed(2)}
const getVar=n=>{let v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return /^#[0-9a-f]{6}$/i.test(v)?v:'#0B5D3B'};

 FORMS.ret=()=>saveSettings({ret:{rej:M_['rt.rej']||RET.rej,inactive:M_['rt.inactive']||RET.inactive,audit:M_['rt.audit']||RET.audit}},'Retention rules saved.');
 ACT.palSave=()=>{const p={};['--brand','--gold','--ink','--surface'].forEach(v=>{const x=document.documentElement.style.getPropertyValue(v).trim();if(x)p[v]=x});saveSettings({palette:p},'Palette saved for everyone.')};
 ACT.palReset=()=>{['--brand','--gold','--ink','--surface'].forEach(v=>document.documentElement.style.removeProperty(v));saveSettings({palette:{}},'Palette reset.')};
 ACT.elecToggle=()=>run(()=>api('POST','/api/admin/election',{on:!ELEC.on}),ELEC.on?'Election mode off.':'Election mode on. Polling units can report.');
 rpDownload=async function(fmt){const d=reportData();closeModal();try{await download('POST','/api/admin/export',{title:RTYPES[RP.type],type:RP.type,fmt,head:d.head,rows:d.rows});toast('Report saved.')}catch(e){fail(e)}};
 ACT.tkClose=a=>run(()=>api('POST',`/api/admin/tickets/${a.dataset.v}/close`,{reply:M_['tk.reply']||''}).then(r=>{closeModal();return r}),'Request closed.');
 ACT.tkApply=a=>run(()=>api('POST',`/api/admin/tickets/${a.dataset.v}/close`,{reply:M_['tk.reply']||'',apply:true}).then(r=>{closeModal();return r}),'Location updated and request closed.');
 /* ---------- coordinators ---------- */
 FORMS.areport=async()=>{clearE('rp.');V.req('rp.title');V.req('rp.date');V.req('rp.att');V.req('rp.sum');if(!E['rp.att']&&+M_['rp.att']<0)E['rp.att']='Enter zero or more.';if(Object.keys(E).some(k=>k.startsWith('rp.'))){modal(reportModal(1),{label:'Activity report'});return toast('Please complete the form.','bad')}
  await run(()=>api('POST','/api/reports',{title:M_['rp.title'],type:M_['rp.type']||'Meeting',date:M_['rp.date'],att:M_['rp.att'],summary:M_['rp.sum']}).then(r=>{['rp.title','rp.att','rp.sum'].forEach(k=>M_[k]='');closeModal();return r}),'Report submitted.')};
 FORMS.act=async()=>{clearE('ac.');V.req('ac.title');V.req('ac.att');if(Object.keys(E).some(k=>k.startsWith('ac.')))return toast('Complete the form.','bad');
  await run(()=>api('POST','/api/reports',{title:M_['ac.title'],type:'Activity record',date:M_['ac.date']||iso(NOW),att:M_['ac.att'],summary:''}).then(r=>{closeModal();return r}),'Activity recorded.')};
 FORMS.wardinfo=()=>{const w=G.ward(S.user.ward);api('PUT','/api/ward-info',{office:M_['wi.office']??w.info?.office??'',note:M_['wi.note']??w.info?.note??''}).then(sync).then(()=>{toast('Saved.');render()}).catch(fail)};
 FORMS.nominate=async f=>{const level=f.dataset.level,geo=f.dataset.geo;if(!(M_['nm.why']||'').trim()){E['nm.why']='Give a reason for the nomination.';modal(nomModal(level,geo));return toast('Add a reason.','bad')}
  await run(()=>api('POST','/api/nominations',{level,geo,member:M_['nm.who'],note:M_['nm.why']}).then(r=>{M_['nm.why']='';closeModal();return r}),'Nomination submitted for State approval.')};
 FORMS.ann=async()=>{clearE('an.');V.req('an.t');V.req('an.b');if(Object.keys(E).some(k=>k.startsWith('an.')))return toast('Add a headline and message.','bad');
  await run(()=>api('POST','/api/announcements',{title:M_['an.t'],body:M_['an.b']}).then(r=>{closeModal();return r}),'Submitted. It stays hidden until approved.')};
 FORMS.req=async()=>{V.req('rq.m');if(E['rq.m'])return toast('Add details.','bad');await run(()=>api('POST','/api/requests/admin',{type:M_['rq.t']||'Update polling-unit information',msg:M_['rq.m']}).then(r=>{closeModal();return r}),'Request sent to your Ward Coordinator.')};
 FORMS.sitrep=async()=>{const u=S.user;if(u.role!=='pu')return toast('Only polling-unit coordinators submit these reports.','bad');if(!ELEC.on)return toast('Election mode is off.','bad');clearE('sr.');const g=k=>M_['sr.'+k];const n=k=>g(k)===undefined||g(k)===''?0:+g(k);
  if((g('accr')??'')!==''&&n('accr')<0)E['sr.accr']='Enter zero or more.';if((g('cast')??'')!==''&&n('cast')<0)E['sr.cast']='Enter zero or more.';if(!E['sr.cast']&&!E['sr.accr']&&n('cast')>n('accr'))E['sr.cast']='Ballots cast cannot be more than accredited voters.';
  const inc=g('inc')||'None',sev=g('sev')||'None';if(inc!=='None'){if(sev==='None')E['sr.sev']='Choose a severity for the incident.';if((g('desc')||'').trim().length<10)E['sr.desc']='Describe what happened in at least 10 characters.'}else if(sev!=='None')E['sr.sev']='Severity applies only when an incident is selected.';
  if(g('valid')&&g('ours')&&+g('ours')>+g('valid'))E['sr.ours']='Votes for the candidate cannot exceed total valid votes.';if(g('valid')&&g('regv')&&+g('valid')>+g('regv'))E['sr.valid']='Valid votes cannot exceed registered voters.';
  if(Object.keys(E).some(k=>k.startsWith('sr.'))){render();toast('Please fix the highlighted fields.','bad');return}
  try{await api('POST','/api/sitreps',{status:g('status')||SIT_ST[0],accr:g('accr')||'',cast:g('cast')||'',mat:g('mat')||'Yes',inc,sev,desc:(g('desc')||'').trim(),regv:g('regv')||'',valid:g('valid')||'',ours:g('ours')||''});
   ['accr','cast','inc','sev','desc','valid','ours'].forEach(k=>delete M_['sr.'+k]);await sync();toast('Situation report submitted.');render()}catch(e){if(!fieldErrs(e,'sr.'))fail(e);render()}};
 ACT.sitAck=a=>{const[id,st]=a.dataset.v.split('|');run(()=>api('POST',`/api/sitreps/${id}/ack`,{status:st}),'Incident '+st.toLowerCase()+'.')};
 ACT.sitExport=async()=>{try{await download('GET','/api/sitreps.csv');toast('Saved.')}catch(e){fail(e)}};
 /* ---------- QR verification ---------- */
 const _vq=ROUTES.v.f;const VQ={};
 ROUTES.v.f=tok=>{if(!VQ[tok]){VQ[tok]='loading';api('GET','/api/verify/'+encodeURIComponent(tok||'')).then(r=>{VQ[tok]=r;if(r.valid)TOK[tok]={id:r.id,status:'Approved',lga:r.lga};render()}).catch(()=>{VQ[tok]={valid:false};render()})}
  if(VQ[tok]==='loading')return siteShell(`<div class="wrap"><div class="authbox" style="text-align:center;padding:60px 0">${logoSvg(56)}<p class="muted" style="margin-top:16px"><span class="spin"></span> Checking membership…</p></div></div>`,'');return _vq(tok)};
 /* ---------- keep the situation room and alerts fresh ---------- */
 setInterval(()=>{if(!S.user||document.hidden)return;const name=curHash().split('-')[0];const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||!$('#ov').hidden;
  if((name==='situation'||name==='notifications')&&!busy)sync().then(render).catch(()=>{});else if(Date.now()-(window.__lastSync||0)>60e3)sync().catch(()=>{});window.__lastSync=Date.now()},20e3);
 SECL.forEach(s=>{s[1]='Implemented'});
}
</script>
